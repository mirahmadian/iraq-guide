<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>راهنمای کاروان | عراق</title>
  <meta name="description" content="راهنمای دیجیتال مدیران کاروان در عراق – ستادها، درمانگاه‌ها، شماره‌های تماس">
  <meta name="theme-color" content="#F0F7F2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="کاروان عراق">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="app-icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="fonts/fonts.css">

  <style>
    :root {
      --bg:        #F0F7F2;
      --surface:   #E2F0E6;
      --card:      #FFFFFF;
      --card2:     #F4FBF6;
      --gold:      #2E7D5E;
      --gold-l:    #3A9B74;
      --gold-dim:  rgba(46,125,94,0.10);
      --gold-dim2: rgba(46,125,94,0.05);
      --emerald-l: #2A9D6E;
      --ruby:      #B83232;
      --ruby-l:    #E74C3C;
      --blue-l:    #5A9CF5;
      --green-wa:  #25D366;
      --c-hq:#2E7D5E; --c-clinic:#D32F2F; --c-consulate:#4F5BB5; --c-hotel:#B48C3C; --c-ins:#2F7BD6; --c-transport:#D9801A;
      --rgb-hq:46,125,94; --rgb-clinic:211,47,47; --rgb-consulate:79,91,181; --rgb-hotel:180,140,60; --rgb-ins:47,123,214; --rgb-transport:217,128,26;
      --text:      #0A2A1A;
      --muted:     #3A6B52;
      --dim:       #6B9B7F;
      --border:    rgba(46,125,94,0.20);
      --border-s:  rgba(46,125,94,0.30);
      --shadow:    0 4px 20px rgba(0,0,0,0.08);
      --r:         16px;
      --r-sm:      10px;
      --font:      'Vazirmatn', sans-serif;
    }
    [data-theme="dark"] {
      --c-clinic:#EF5350; --c-consulate:#8E9BF0; --c-hotel:#D4AA60; --c-ins:#6AA9F5; --c-transport:#F0A04B;
      --bg:        #0A1F14;
      --surface:   #0E2A1C;
      --card:      #133523;
      --card2:     #16482F;
      --gold-dim:  rgba(46,125,94,0.12);
      --gold-dim2: rgba(46,125,94,0.06);
      --text:      #F5F5F0;
      --muted:     #9BBFAE;
      --dim:       #5A8A72;
      --border:    rgba(46,125,94,0.20);
      --border-s:  rgba(46,125,94,0.35);
      --shadow:    0 6px 28px rgba(0,0,0,0.5);
    }

    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    button,input,select,textarea{font-family:var(--font)}
    html{scroll-behavior:smooth}
    body{
      font-family:var(--font);
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      overflow-x:hidden;
    }
    body::before{
      content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
      background-image:url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='rgba(46,125,94,0.08)' stroke-width='0.8'%3E%3Cpolygon points='50%2C8 59%2C35 88%2C35 65%2C53 74%2C80 50%2C62 26%2C80 35%2C53 12%2C35 41%2C35'/%3E%3Ccircle cx='50' cy='50' r='22'/%3E%3C/g%3E%3C/svg%3E");
      background-size:100px 100px;
    }
    body::after{
      content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
      background:
        radial-gradient(ellipse 60% 40% at 15% 5%,rgba(46,125,94,0.06) 0%,transparent 60%),
        radial-gradient(ellipse 50% 40% at 85% 95%,rgba(46,125,94,0.05) 0%,transparent 60%);
    }

    .app-wrapper{
      position:relative;z-index:1;
      max-width:480px;margin:0 auto;
      min-height:100vh;display:flex;flex-direction:column;
    }

    /* ── HEADER ── */
    .header{
      position:sticky;top:0;z-index:100;
      padding:14px 14px 6px;
      background:linear-gradient(180deg,var(--bg) 75%,transparent);
      backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    }
    .header-inner{
      display:flex;align-items:center;justify-content:space-between;
      background:var(--surface);border:1px solid var(--border-s);
      border-radius:var(--r);padding:11px 14px;box-shadow:var(--shadow);
    }
    .header-brand{display:flex;align-items:center;gap:10px}
    .brand-icon{
      width:42px;height:42px;border-radius:12px;
      background:linear-gradient(135deg,var(--gold) 0%,var(--gold-l) 100%);
      display:flex;align-items:center;justify-content:center;font-size:calc(22px * var(--fs,1));
      box-shadow:0 2px 12px rgba(46,125,94,0.35);flex-shrink:0;
    }
    .brand-text h1{font-size:calc(14px * var(--fs,1));font-weight:800;color:var(--text);line-height:1.2}
    .brand-text p{font-size:calc(10.5px * var(--fs,1));color:var(--muted);font-weight:400;margin-top:1px}
    .header-actions{display:flex;gap:7px;align-items:center}
    .icon-btn{
      width:40px;height:40px;border:1px solid var(--border);
      border-radius:10px;background:var(--card);color:var(--muted);font-family:var(--font);font-weight:800;
      cursor:pointer;display:flex;align-items:center;justify-content:center;
      font-size:calc(15px * var(--fs,1));transition:all .2s;
    }
    .icon-btn:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-dim)}
    .hajj-logo{
      width:36px;height:36px;border-radius:9px;object-fit:contain;
      background:var(--card);border:1px solid var(--border);
      padding:5px;flex-shrink:0;
    }
    [data-theme="dark"] .hajj-logo{filter:brightness(0) invert(1)}

    /* ── SEARCH ── */
    .search-wrap{
      padding:0 14px 8px;
    }
    .search-box{
      display:flex;align-items:center;gap:9px;
      background:var(--card);border:1px solid var(--border-s);
      border-radius:var(--r-sm);padding:10px 13px;
      box-shadow:var(--shadow);transition:border-color .2s;
    }
    .search-box:focus-within{border-color:var(--gold)}
    .search-ico{font-size:calc(16px * var(--fs,1));color:var(--dim);flex-shrink:0}
    .search-box input{
      flex:1;border:none;background:transparent;
      font-family:var(--font);font-size:calc(13px * var(--fs,1));color:var(--text);
      outline:none;direction:rtl;
    }
    .search-box input::placeholder{color:var(--dim)}
    .search-clear{
      background:none;border:none;cursor:pointer;
      font-size:calc(13px * var(--fs,1));color:var(--dim);padding:0;display:none;
    }
    .search-clear.show{display:block}
    .search-results{
      display:none;margin:0 14px 10px;
      background:var(--card);border:1px solid var(--border-s);
      border-radius:var(--r-sm);overflow:hidden;box-shadow:var(--shadow);
    }
    .search-results.show{display:block}
    .sr-header{
      padding:8px 14px;font-size:calc(10px * var(--fs,1));color:var(--dim);font-weight:600;
      border-bottom:1px solid var(--border);background:var(--card2);
    }
    .sr-empty{padding:14px;text-align:center;font-size:calc(12px * var(--fs,1));color:var(--dim);font-style:italic}

    /* ── INSTALL BANNER ── */
    .install-banner{
      display:none;margin:0 14px 8px;
      background:linear-gradient(135deg,rgba(46,125,94,0.13),rgba(46,125,94,0.06));
      border:1px solid var(--border-s);border-radius:var(--r-sm);
      padding:11px 13px;align-items:center;gap:11px;
    }
    .install-banner.show{display:flex}
    .install-text{flex:1;font-size:calc(11.5px * var(--fs,1));color:var(--muted);line-height:1.55}
    .install-text strong{display:block;font-size:calc(12.5px * var(--fs,1));color:var(--gold);margin-bottom:2px}
    .install-btn{
      padding:8px 14px;background:var(--gold);color:#FFF;
      border:none;border-radius:8px;font-family:var(--font);
      font-size:calc(12px * var(--fs,1));font-weight:700;cursor:pointer;flex-shrink:0;transition:background .2s;
    }
    .install-btn:hover{background:var(--gold-l)}

    /* ── EMERGENCY ── */
    .emergency{
      margin:0 14px 8px;
      background:linear-gradient(135deg,rgba(183,50,50,0.13),rgba(183,50,50,0.07));
      border:1px solid rgba(183,50,50,0.28);border-radius:var(--r-sm);overflow:hidden;
    }
    .emergency-head{
      display:flex;align-items:center;justify-content:space-between;
      padding:11px 14px;cursor:pointer;user-select:none;
    }
    .emergency-label{display:flex;align-items:center;gap:8px;font-size:calc(12.5px * var(--fs,1));font-weight:700;color:var(--ruby-l)}
    .e-pulse{width:8px;height:8px;background:var(--ruby-l);border-radius:50%;animation:epulse 1.6s infinite}
    @keyframes epulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.75)}}
    .emergency-arrow{color:var(--ruby-l);font-size:calc(11px * var(--fs,1));transition:transform .3s}
    .emergency.open .emergency-arrow{transform:rotate(180deg)}
    .emergency-body{display:none;padding:0 14px 13px}
    .emergency.open .emergency-body{display:block}
    .e-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
    .e-item{background:rgba(183,50,50,0.09);border:1px solid rgba(183,50,50,0.18);border-radius:8px;padding:10px;text-align:center}
    .e-label{font-size:calc(10px * var(--fs,1));color:rgba(231,76,60,.75);margin-bottom:3px}
    .e-num{font-size:calc(20px * var(--fs,1));font-weight:900;color:var(--ruby-l);letter-spacing:1px}

    /* ── GLOBAL CARDS (insurance + transport) ── */
    .global-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:0 14px 10px}
    .global-ins{
      --accent:var(--c-ins);--accent-rgb:var(--rgb-ins);
      background:var(--card);border:1px solid rgba(var(--accent-rgb),.30);
      border-top:3px solid var(--accent);border-radius:var(--r-sm);overflow:hidden;
      display:flex;flex-direction:column;box-shadow:var(--shadow);
    }
    .global-ins.k-transport{--accent:var(--c-transport);--accent-rgb:var(--rgb-transport)}
    .global-ins-head{
      display:flex;align-items:center;gap:7px;padding:9px 10px;
      background:rgba(var(--accent-rgb),.09);border-bottom:1px solid rgba(var(--accent-rgb),.18);
    }
    .global-ins-ico{font-size:calc(16px * var(--fs,1));flex-shrink:0}
    .global-ins-title{font-size:calc(11px * var(--fs,1));font-weight:800;color:var(--accent);line-height:1.5;flex:1}
    .global-ins-body{padding:12px 10px 11px;flex:1;display:flex}
    .gin-row{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;width:100%}
    .c-avatar.big{width:72px;height:72px;border-radius:50%;font-size:calc(30px * var(--fs,1));
      background:rgba(var(--accent-rgb),.10);border:2px solid rgba(var(--accent-rgb),.35)}
    .c-avatar.big img{border-radius:50%}
    .gin-info{width:100%;min-width:0}
    .gin-name{font-size:calc(12.5px * var(--fs,1));font-weight:800;color:var(--text);margin-bottom:1px}
    .gin-role{font-size:calc(10px * var(--fs,1));color:var(--dim);margin-bottom:4px;line-height:1.5}
    .gin-phone{font-size:calc(15.5px * var(--fs,1));font-weight:800;color:var(--text);direction:ltr;letter-spacing:.2px}
    .gin-acts{display:flex;gap:6px;width:100%;margin-top:2px}
    .gin-acts .act{flex:1;width:auto;height:44px}

    /* ── LAST UPDATE BADGE ── */
    .update-badge{
      margin:0 14px 8px;
      display:flex;align-items:center;gap:7px;
      background:var(--gold-dim2);border:1px solid var(--border);
      border-radius:8px;padding:7px 12px;
    }
    .update-badge span{font-size:calc(11px * var(--fs,1));color:var(--dim)}
    .update-badge strong{font-size:calc(11px * var(--fs,1));color:var(--gold);font-weight:700}

    /* ── TABS ── */
    .tabs-wrap{
      padding:0 14px;margin-bottom:10px;
      position:sticky;top:76px;z-index:90;
    }
    .tabs{
      display:flex;gap:5px;
      background:var(--surface);border:1px solid var(--border);
      border-radius:var(--r);padding:5px;box-shadow:var(--shadow);
    }
    .tab{
      flex:1;padding:9px 4px;border:none;border-radius:9px;
      background:transparent;color:var(--muted);
      font-family:var(--font);font-size:calc(11.5px * var(--fs,1));font-weight:600;
      cursor:pointer;transition:all .22s;display:flex;flex-direction:column;
      align-items:center;gap:2px;line-height:1.2;
    }
    .tab-icon{font-size:calc(17px * var(--fs,1))}
    .tab.active{
      background:linear-gradient(135deg,var(--gold),var(--gold-l));
      color:#FFFFFF;box-shadow:0 2px 14px rgba(46,125,94,0.32);
    }

    /* ── CONTENT ── */
    .content{flex:1;padding:0 14px 110px}
    .city-sec{display:none}
    .city-sec.active{display:block;animation:fadeUp .28s ease}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

    .city-hero{
      margin-bottom:12px;padding:26px 16px 62px;
      background:
        url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='rgba(255,255,255,0.07)' stroke-width='1'%3E%3Cpolygon points='50%2C8 59%2C35 88%2C35 65%2C53 74%2C80 50%2C62 26%2C80 35%2C53 12%2C35 41%2C35'/%3E%3Ccircle cx='50' cy='50' r='22'/%3E%3C/g%3E%3C/svg%3E"),
        linear-gradient(160deg,#1F6B4E 0%,#2E7D5E 55%,#3A9B74 100%);
      border-radius:var(--r);text-align:center;position:relative;overflow:hidden;
      box-shadow:0 8px 26px rgba(46,125,94,.28);color:#fff;
    }
    [data-theme="dark"] .city-hero{background:
        url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='rgba(255,255,255,0.05)' stroke-width='1'%3E%3Cpolygon points='50%2C8 59%2C35 88%2C35 65%2C53 74%2C80 50%2C62 26%2C80 35%2C53 12%2C35 41%2C35'/%3E%3Ccircle cx='50' cy='50' r='22'/%3E%3C/g%3E%3C/svg%3E"),
        linear-gradient(160deg,#0E3A28 0%,#14543A 100%)}
    .city-hero.has-img,[data-theme="dark"] .city-hero.has-img{
      padding:44px 16px 40px;min-height:200px;display:flex;flex-direction:column;justify-content:center;
      background:
        linear-gradient(180deg,rgba(8,36,24,.38) 0%,rgba(8,36,24,.74) 100%),
        var(--hero-img) var(--fx,50%) var(--fy,40%) / cover no-repeat,
        #1F6B4E;
    }
    .city-hero.has-img .hero-skyline{display:none}
    .city-hero.has-img .hero-name{text-shadow:0 2px 18px rgba(0,0,0,.65)}
    .city-hero.has-img .hero-ar,.city-hero.has-img .hero-shrine{text-shadow:0 1px 10px rgba(0,0,0,.7)}
    .hero-skyline{position:absolute;left:0;right:0;bottom:0;width:100%;height:56px;fill:rgba(255,255,255,.13);pointer-events:none}
    .hero-name{
      font-size:calc(34px * var(--fs,1));font-weight:900;line-height:1.3;position:relative;z-index:1;
      color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.28);letter-spacing:-.3px;
    }
    .hero-orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px auto 8px;position:relative;z-index:1;color:#F3DFA2;font-size:calc(12px * var(--fs,1))}
    .hero-orn span{height:1px;width:52px;background:linear-gradient(90deg,transparent,rgba(243,223,162,.85))}
    .hero-orn span:last-child{background:linear-gradient(270deg,transparent,rgba(243,223,162,.85))}
    .hero-ar{font-size:calc(21px * var(--fs,1));font-weight:700;color:#F3DFA2;position:relative;z-index:1;line-height:1.5}
    .hero-shrine{font-size:calc(11.5px * var(--fs,1));font-weight:400;color:rgba(255,255,255,.82);position:relative;z-index:1;line-height:1.8;margin-top:2px}

    /* ── QUICK NAV ── */
    .quick-nav{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding:2px 1px 4px;scrollbar-width:none}
    .quick-nav::-webkit-scrollbar{display:none}
    .qn{
      --accent:var(--c-hq);--accent-rgb:var(--rgb-hq);
      flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;
      padding:10px 14px;min-height:44px;border-radius:12px;white-space:nowrap;
      border:1.5px solid rgba(var(--accent-rgb),.40);background:rgba(var(--accent-rgb),.09);
      color:var(--accent);font-family:var(--font);font-size:calc(13px * var(--fs,1));font-weight:800;cursor:pointer;
    }
    .qn:active{background:rgba(var(--accent-rgb),.22)}
    .qn .rc{width:18px;height:18px}
    .flash{animation:flash 1.1s ease}
    @keyframes flash{0%,60%{box-shadow:0 0 0 3px var(--accent,var(--gold))}100%{box-shadow:var(--shadow)}}
    .sec-card,.hotel-search-wrap{scroll-margin-top:var(--stick,150px)}
    .rc{display:block;width:22px;height:22px}

    /* ── CARDS ── */
    .sec-card{
      background:var(--card);border:1px solid var(--border);
      border-radius:var(--r);margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow);
    }
    .sec-head{
      display:flex;align-items:center;gap:10px;padding:13px 15px;
      border-bottom:1px solid var(--border);
      background:linear-gradient(135deg,var(--card),var(--card2));
    }
    .sec-ico{
      width:38px;height:38px;border-radius:10px;
      display:flex;align-items:center;justify-content:center;font-size:calc(18px * var(--fs,1));flex-shrink:0;
    }
    .sec-card{--accent:var(--c-hq);--accent-rgb:var(--rgb-hq);border-top:3px solid var(--accent)}
    .sec-card.k-clinic{--accent:var(--c-clinic);--accent-rgb:var(--rgb-clinic)}
    .sec-card.k-consulate{--accent:var(--c-consulate);--accent-rgb:var(--rgb-consulate)}
    .sec-ico{background:rgba(var(--accent-rgb),.14)}
    .ico-hotel{background:rgba(var(--rgb-hotel),.18)}
    .badge-acc{background:rgba(var(--accent-rgb),.13);color:var(--accent);border-color:rgba(var(--accent-rgb),.32)}
    .badge-hotel{background:rgba(var(--rgb-hotel),.13);color:var(--c-hotel);border-color:rgba(var(--rgb-hotel),.30)}
    .sec-card .c-avatar{background:rgba(var(--accent-rgb),.08);border-color:rgba(var(--accent-rgb),.25)}
    .sec-card .addr-ico{background:rgba(var(--accent-rgb),.12)}

    /* ── HOTEL SEARCH BOX ── */
    .hotel-search-wrap{
      background:var(--card);border:1px solid var(--border);
      border-radius:var(--r);margin-bottom:14px;overflow:visible;border-top:3px solid var(--c-hotel);
      box-shadow:var(--shadow);position:relative;
    }
    .hotel-search-head{
      display:flex;align-items:center;gap:10px;padding:13px 15px;
      border-bottom:1px solid var(--border);
      background:linear-gradient(135deg,var(--card),var(--card2));
      border-radius:var(--r) var(--r) 0 0;
    }
    .hotel-search-input-wrap{
      display:flex;align-items:center;gap:9px;
      padding:11px 14px;
    }
    .hotel-search-ico{font-size:calc(16px * var(--fs,1));color:var(--dim);flex-shrink:0}
    .hotel-search-input{
      flex:1;border:none;background:transparent;
      font-family:var(--font);font-size:calc(13px * var(--fs,1));color:var(--text);
      outline:none;direction:rtl;
    }
    .hotel-search-input::placeholder{color:var(--dim)}
    .hotel-search-clear{
      background:none;border:none;cursor:pointer;
      font-size:calc(13px * var(--fs,1));color:var(--dim);padding:0;display:none;
    }
    .hotel-search-clear.show{display:block}
    .hotel-dropdown{
      display:none;border-top:1px solid var(--border);
    }
    .hotel-dropdown.show{display:block}
    .hotel-drop-item{
      display:flex;align-items:center;gap:10px;
      padding:11px 15px;cursor:pointer;transition:background .15s;
      border-bottom:1px solid var(--border);
    }
    .hotel-drop-item:last-child{border-bottom:none}
    .hotel-drop-item:hover,.hotel-drop-item:active{background:var(--card2)}
    .hotel-drop-name{font-size:calc(13px * var(--fs,1));font-weight:600;color:var(--text)}
    .hotel-drop-sub{font-size:calc(10.5px * var(--fs,1));color:var(--dim);margin-top:2px}
    .hotel-list-cap{padding:8px 15px 4px;font-size:calc(10.5px * var(--fs,1));color:var(--dim);font-weight:700}
    .hotel-more{padding:12px 15px;text-align:center;font-size:calc(12.5px * var(--fs,1));font-weight:800;color:var(--c-hotel);cursor:pointer;border-top:1px solid var(--border)}
    .hotel-more small{font-weight:400;color:var(--dim);font-size:calc(10.5px * var(--fs,1))}
    .hotel-empty{padding:14px;text-align:center;font-size:calc(12px * var(--fs,1));color:var(--dim);font-style:italic}

    /* ── HOTEL DETAIL (expanded) ── */
    .hotel-detail{display:none;border-top:1px solid var(--border)}
    .hotel-detail.show{display:block}
    .hotel-detail-head{
      display:flex;align-items:center;gap:10px;
      padding:12px 15px;border-bottom:1px solid var(--border);
      background:linear-gradient(135deg,rgba(180,140,60,.08),rgba(180,140,60,.03));
    }
    .hotel-detail-back{
      background:none;border:1px solid var(--border);border-radius:8px;
      width:30px;height:30px;cursor:pointer;color:var(--muted);
      display:flex;align-items:center;justify-content:center;font-size:calc(13px * var(--fs,1));
      flex-shrink:0;
    }
    .hotel-detail-name{flex:1;font-size:calc(13px * var(--fs,1));font-weight:700;color:var(--text)}
    .hotel-card-img-btn{
      display:flex;align-items:center;gap:8px;
      padding:10px 15px;border-bottom:1px solid var(--border);
      background:none;border-top:none;border-left:none;border-right:none;
      width:100%;cursor:pointer;font-family:var(--font);
      color:var(--muted);font-size:calc(12px * var(--fs,1));font-weight:600;
      transition:background .15s;text-align:right;
    }
    .hotel-card-img-btn:hover,.hotel-card-img-btn:active{background:var(--card2);color:var(--gold)}
    .hotel-card-img-btn span{flex:0 0 auto}
    .hotel-card-img-btn .hc-txt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .hotel-thumb{width:46px;height:46px;border-radius:10px;object-fit:cover;flex-shrink:0;border:1px solid var(--border);background:var(--card2)}
    .hotel-thumb.lg{width:52px;height:52px;border-radius:12px;cursor:zoom-in}

    /* ── PHOTO LIGHTBOX ── */
    .photo-overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:260;display:none;
      align-items:center;justify-content:center;padding:18px;cursor:zoom-out;
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
    .photo-overlay.open{display:flex}
    .photo-box{text-align:center;animation:zoomIn .25s ease;max-width:100%}
    .photo-box img{max-width:94vw;max-height:78vh;border-radius:18px;box-shadow:0 12px 50px rgba(0,0,0,.6);display:block;margin:0 auto}
    .photo-cap{margin-top:14px;color:#fff;font-size:calc(15px * var(--fs,1));font-weight:700}
    @keyframes zoomIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}

    /* ── HOTEL GALLERY ── */
    .card-img-wrap{position:relative}
    .gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;width:100%;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .gal::-webkit-scrollbar{display:none}
    .gal img{flex:0 0 100%;width:100%;max-height:68vh;object-fit:contain;scroll-snap-align:center;border-radius:0;background:#111}
    .gal-nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:none;
      background:rgba(0,0,0,.5);color:#fff;font-size:26px;line-height:1;cursor:pointer;font-family:var(--font)}
    .gal-nav svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;display:block;margin:auto}
    .gal-nav{display:flex;align-items:center;justify-content:center;padding:0}
    .gal-prev{right:8px}.gal-next{left:8px}
    .gal-dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px;pointer-events:none}
    .gal-dots span{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.45)}
    .gal-dots span.on{background:#fff;transform:scale(1.25)}
    .gal-count{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:100px}

    /* ── BUSINESS CARD MODAL ── */
    .card-overlay{
      position:fixed;inset:0;background:rgba(0,0,0,.88);
      backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
      z-index:200;display:none;align-items:center;justify-content:center;
      padding:20px;
    }
    .card-overlay.open{display:flex}
    .card-modal{
      background:var(--surface);border:1px solid var(--border-s);
      border-radius:var(--r);width:100%;max-width:440px;
      padding:18px;animation:fadeUp .25s ease;
    }
    .card-modal-header{
      display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;
    }
    .card-modal-title{font-size:calc(14px * var(--fs,1));font-weight:800;color:var(--text)}
    .card-modal-close{
      width:32px;height:32px;border-radius:8px;border:1px solid var(--border);
      background:var(--card);color:var(--muted);cursor:pointer;
      display:flex;align-items:center;justify-content:center;font-size:calc(14px * var(--fs,1));
    }
    .card-img-wrap{
      border-radius:10px;overflow:hidden;background:#111;
      display:flex;align-items:center;justify-content:center;min-height:180px;
    }
    .card-img-wrap img{width:100%;height:auto;display:block;border-radius:10px}
    .card-img-placeholder{
      padding:30px;text-align:center;color:var(--dim);font-size:calc(12px * var(--fs,1));line-height:2;
    }

    .sec-info{flex:1}
    .sec-info h3{font-size:calc(13.5px * var(--fs,1));font-weight:700;color:var(--text)}
    .badge{font-size:calc(10px * var(--fs,1));padding:2px 9px;border-radius:6px;font-weight:600;border:1px solid;flex-shrink:0}
    .badge-gold{background:var(--gold-dim);color:var(--gold);border-color:var(--border-s)}
    .badge-green{background:rgba(46,125,94,.13);color:var(--emerald-l);border-color:rgba(46,125,94,.28)}
    .badge-blue{background:rgba(90,156,245,.12);color:var(--blue-l);border-color:rgba(90,156,245,.28)}
    .badge-ruby{background:rgba(184,50,50,.13);color:#F08080;border-color:rgba(184,50,50,.28)}

    .addr-row{
      display:flex;align-items:flex-start;gap:10px;
      padding:11px 15px;border-bottom:1px solid var(--border);
    }
    .addr-ico{
      width:28px;height:28px;border-radius:7px;background:var(--gold-dim);
      display:flex;align-items:center;justify-content:center;font-size:calc(13px * var(--fs,1));flex-shrink:0;margin-top:1px;
    }
    .addr-lbl{font-size:calc(10px * var(--fs,1));color:var(--dim);font-weight:500;margin-bottom:3px}
    .addr-txt{font-size:calc(12.5px * var(--fs,1));color:var(--muted);line-height:1.75}

    .map-row{display:flex;gap:7px;padding:9px 15px;border-bottom:1px solid var(--border)}
    .map-btn{
      flex:1;padding:12px 6px;min-height:44px;border-radius:10px;border:1px solid;
      background:transparent;font-family:var(--font);font-size:calc(11px * var(--fs,1));font-weight:600;
      cursor:pointer;display:flex;align-items:center;justify-content:center;
      gap:5px;text-decoration:none;transition:all .18s;
    }
    .map-g{border-color:rgba(90,156,245,.28);color:var(--blue-l);background:rgba(90,156,245,.06)}
    .map-g:hover{background:rgba(90,156,245,.14)}
    .map-n{border-color:rgba(var(--accent-rgb,46,125,94),.35);color:var(--accent,var(--gold));background:rgba(var(--accent-rgb,46,125,94),.06)}
    .map-route{flex:1.25;border-color:transparent;background:var(--accent,var(--gold));color:#fff;font-weight:800}
    .map-route:active{opacity:.85}
    .map-n:hover{background:var(--gold-dim)}

    /* ── CONTACTS ── */
    .divider-lbl{
      padding:10px 15px 5px;font-size:calc(10px * var(--fs,1));color:var(--dim);font-weight:600;
      letter-spacing:.5px;text-transform:uppercase;border-top:1px solid var(--border);
    }
    .c-item{
      display:flex;align-items:center;gap:10px;
      padding:12px 15px;border-bottom:1px solid var(--border);
      transition:background .15s;
    }
    .c-item:last-child{border-bottom:none}
    .c-item:hover{background:var(--card2)}
    .c-avatar{
      width:46px;height:46px;border-radius:12px;padding:0;overflow:hidden;
      background:var(--gold-dim2);border:1px solid var(--border);
      display:flex;align-items:center;justify-content:center;font-size:calc(18px * var(--fs,1));flex-shrink:0;
    }
    button.c-avatar{cursor:zoom-in;font-family:var(--font)}
    .c-avatar img{width:100%;height:100%;object-fit:cover;display:block}
    .c-info{flex:1;min-width:0}
    .c-name{font-weight:600}
    .c-role{font-size:calc(10.5px * var(--fs,1));color:var(--dim);font-weight:500;margin-bottom:2px}
    .c-name{font-size:calc(11px * var(--fs,1));color:var(--muted);margin-top:1px}
    .c-phone{font-size:calc(17.5px * var(--fs,1));font-weight:800;color:var(--text);direction:ltr;text-align:right;letter-spacing:.5px}
    .c-acts{display:flex;gap:5px;flex-shrink:0}
    .act{
      width:44px;height:44px;border-radius:11px;border:1.5px solid;
      background:transparent;cursor:pointer;display:flex;align-items:center;
      justify-content:center;text-decoration:none;transition:all .18s;
    }
    .act-call{border-color:rgba(46,125,94,.3);color:var(--emerald-l)}
    .act-call:hover{background:rgba(46,125,94,.15);border-color:var(--emerald-l)}
    .act-wa{border-color:rgba(37,211,102,.28);color:var(--green-wa)}
    .act-wa:hover{background:rgba(37,211,102,.1);border-color:var(--green-wa)}
    .act-cp{border-color:var(--border);color:var(--muted)}
    .act-cp:hover,.act-cp.done{border-color:var(--gold);color:var(--gold);background:var(--gold-dim)}

    /* WhatsApp SVG icon */
    .wa-icon{width:22px;height:22px;display:block}

    /* ── BOTTOM BAR ── */
    .bot-bar{
      position:fixed;bottom:0;left:50%;transform:translateX(-50%);
      width:100%;max-width:480px;z-index:100;
      padding:10px 14px max(12px,env(safe-area-inset-bottom)) 14px;
      background:linear-gradient(0,var(--bg) 65%,transparent);
    }
    .bot-inner{display:flex;gap:8px}
    .bot-btn{
      flex:1;padding:13px;border-radius:var(--r-sm);border:1px solid var(--border);
      background:var(--card);font-family:var(--font);font-size:calc(12.5px * var(--fs,1));font-weight:600;
      color:var(--muted);cursor:pointer;display:flex;align-items:center;
      justify-content:center;gap:6px;transition:all .2s;box-shadow:var(--shadow);
    }
    .bot-btn:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-dim)}
    .bot-btn.prime{
      background:linear-gradient(135deg,var(--gold),var(--gold-l));
      color:#FFFFFF;border-color:transparent;font-weight:800;
      box-shadow:0 3px 16px rgba(46,125,94,0.3);
    }

    /* ── MODAL / QR ── */
    .overlay{
      position:fixed;inset:0;background:rgba(0,0,0,.72);
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
      z-index:200;display:none;align-items:flex-end;justify-content:center;
    }
    .overlay.open{display:flex}
    .modal{
      background:var(--surface);border:1px solid var(--border-s);
      border-radius:22px 22px 0 0;width:100%;max-width:480px;
      padding:20px 22px max(22px,env(safe-area-inset-bottom)) 22px;
      animation:slideUp .3s ease;
    }
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .modal-handle{width:38px;height:4px;background:var(--border-s);border-radius:2px;margin:0 auto 18px}
    .modal-title{font-size:calc(16px * var(--fs,1));font-weight:800;color:var(--text);text-align:center;margin-bottom:18px}
    .qr-wrap{
      display:flex;justify-content:center;padding:16px;
      background:#fff;border-radius:14px;margin-bottom:12px;
    }
    .qr-url{text-align:center;font-size:calc(10.5px * var(--fs,1));color:var(--muted);direction:ltr;word-break:break-all;margin-bottom:16px}
    .modal-close{
      width:100%;padding:13px;border-radius:11px;border:1px solid var(--border);
      background:var(--card);color:var(--muted);font-family:var(--font);
      font-size:calc(13px * var(--fs,1));font-weight:600;cursor:pointer;transition:all .2s;
    }
    .modal-close:hover{border-color:var(--gold);color:var(--gold)}

    /* ── TOAST ── */
    .toast{
      position:fixed;bottom:95px;left:50%;
      transform:translateX(-50%) translateY(16px);
      background:var(--card);border:1px solid var(--border-s);
      border-radius:100px;padding:9px 20px;
      font-size:calc(12.5px * var(--fs,1));font-weight:700;color:var(--gold);
      box-shadow:var(--shadow);opacity:0;transition:all .3s;
      z-index:300;white-space:nowrap;
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* ── FOOTER ── */
    .footer{
      margin:20px 14px 130px;
      background:var(--card);border:1px solid var(--border);
      border-radius:var(--r);padding:18px 16px;text-align:center;
    }
    .footer-bismillah{font-size:calc(15px * var(--fs,1));color:var(--gold);font-weight:700;margin-bottom:10px;letter-spacing:.5px;line-height:1.8}
    .footer-text{font-size:calc(12.5px * var(--fs,1));color:var(--muted);line-height:2;margin-bottom:6px}
    .footer-text strong{color:var(--gold);font-weight:700}
    .footer-bold{font-size:calc(13px * var(--fs,1));color:var(--gold);font-weight:700;line-height:2;margin-bottom:6px}
    .footer-update{margin-top:12px;font-size:calc(11px * var(--fs,1));color:var(--dim)}
    .footer-update strong{color:var(--gold);font-weight:700}
    .footer-admin{display:inline-block;margin-top:14px;padding:8px 14px;font-size:calc(11px * var(--fs,1));color:var(--dim);text-decoration:none;
      border:1px dashed var(--border-s);border-radius:100px}
    .footer-divider{height:1px;background:var(--border);margin:12px 0}

    ::-webkit-scrollbar{width:3px}
    ::-webkit-scrollbar-thumb{background:var(--border-s);border-radius:3px}
  </style>
</head>
<body>
<div class="app-wrapper">

  <!-- HEADER -->
  <header class="header" role="banner">
    <div class="header-inner">
      <div class="header-brand">
        <div class="brand-icon" aria-hidden="true">
                                                🕌
      </div>
        <div class="brand-text">
          <h1 id="appTitle">راهنمای کاروان عراق</h1>
          <p id="appSub">ستادها، درمانگاه‌ها و شماره‌های تماس</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="fsBtn" aria-label="تغییر اندازه نوشته" title="اندازه نوشته">Aa</button>
        <button class="icon-btn" id="themeBtn" aria-label="فعال کردن حالت تیره">🌙</button>
        <img src="hajj-logo.png" class="hajj-logo" alt="سازمان حج و زیارت" title="سازمان حج و زیارت"
             onerror="this.style.display='none'">
      </div>
    </div>
  </header>

  <!-- SEARCH -->
  <div class="search-wrap" role="search">
    <div class="search-box">
      <span class="search-ico" aria-hidden="true">🔍</span>

      <button class="search-clear" id="searchClear" aria-label="پاک کردن جستجو">✕</button>
    </div>
  </div>
  <div class="search-results" id="searchResults" role="region" aria-label="نتایج جستجو">
    <div class="sr-header">نتایج جستجو</div>
    <div id="srBody"></div>
  </div>

  <!-- INSTALL BANNER -->
  <div class="install-banner" id="installBanner" role="complementary" aria-label="نصب برنامه">
    <span aria-hidden="true" style="font-size:20px">📲</span>
    <div class="install-text">
      <strong>نصب روی گوشی</strong>
      بدون اینترنت هم کار می‌کند
    </div>
    <button class="install-btn" id="installBtn">نصب</button>

  <!-- GLOBAL INSURANCE (rendered by JS) -->
  <div id="globalInsurance"></div>

  <!-- FOOD PLAN ENTRY (rendered by JS) -->

  <!-- TABS -->

    <div class="tabs" role="tablist" id="tabList"></div>
  </nav>

  <!-- CONTENT (rendered by JS) -->
  <main class="content" id="mainContent"></main>

  <!-- BOTTOM BUTTONS -->
  <div class="bot-bar">

      <button class="bot-btn" onclick="showQR()" aria-label="نمایش QR کد برنامه">📱 QR کد</button>

</div><!-- /app-wrapper -->

<!-- PHOTO LIGHTBOX -->
<div class="photo-overlay" id="photoOverlay" onclick="closePhoto()" role="dialog" aria-modal="true" aria-label="نمایش تصویر">
  <div class="photo-box"><img id="photoImg" alt=""><div class="photo-cap" id="photoCap"></div></div>
</div>

<!-- BUSINESS CARD MODAL -->
<div class="card-overlay" id="cardOverlay" role="dialog" aria-modal="true" aria-label="کارت ویزیت هتل">
  <div class="card-modal">
    <div class="card-modal-header">
      <div class="card-modal-title" id="cardModalTitle">کارت ویزیت هتل</div>
      <button class="card-modal-close" onclick="closeCardModal()" aria-label="بستن">✕</button>

    <div class="card-img-wrap" id="cardImgWrap"></div>

<!-- QR MODAL -->

  <div class="modal">
    <div class="modal-handle" aria-hidden="true"></div>
    <div class="modal-title">📱 QR کد برنامه</div>
    <div class="qr-wrap"><div id="qrcode"></div></div>
    <p class="qr-url" id="qrUrl"></p>
    <button class="modal-close" onclick="closeQR()">بستن</button>
  </div>

<!-- TOAST -->

<!-- DATA FILE (must come before main script) -->

<script src="food.js"></script>

<script>
/* ══════════════════════════════════════════
   PREVIEW (پیش‌نمایش مدیر) + نمایش بخش‌های پنهان برای مدیر
══════════════════════════════════════════ */
const PREVIEW = new URLSearchParams(location.search).has('preview');
let IS_ADMIN_DEVICE = false;
try { IS_ADMIN_DEVICE = !!localStorage.getItem('caravan-admin-token'); } catch (e) {}
const SHOW_HIDDEN = PREVIEW || IS_ADMIN_DEVICE;
if (PREVIEW) {
  try {
    const draft = JSON.parse(localStorage.getItem('caravan-draft') || 'null');
    if (draft) { Object.keys(CARAVAN_DATA).forEach(k => delete CARAVAN_DATA[k]); Object.assign(CARAVAN_DATA, draft); }
  } catch (e) {}
  document.querySelector('.app-wrapper').insertAdjacentHTML('afterbegin',
    '<div class="preview-bar">👁 پیش‌نمایش مدیر — این نسخه هنوز منتشر نشده است<a href="index.html">نسخه منتشرشده</a></div>');
  /* هر تغییری در پنل ادمین، این تب را خودکار تازه می‌کند */
  window.addEventListener('storage', e => {
    if (e.key !== 'caravan-draft') return;
    try {
      sessionStorage.setItem('caravan-scroll', String(window.scrollY));
      const b = document.getElementById('fvBody');
      if (b) sessionStorage.setItem('caravan-food-scroll', String(b.scrollTop));
    } catch (_) {}
    location.reload();
  });
}

/* ══════════════════════════════════════════
   THEME  (persisted in localStorage)
══════════════════════════════════════════ */
const themeBtn = document.getElementById('themeBtn');
const savedTheme = localStorage.getItem('caravan-theme');
let dark = savedTheme ? savedTheme === 'dark' : false;

function applyTheme(isDark) {
  dark = isDark;
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  themeBtn.textContent = dark ? '☀️' : '🌙';
  themeBtn.setAttribute('aria-label', dark ? 'فعال کردن حالت روشن' : 'فعال کردن حالت تیره');
  localStorage.setItem('caravan-theme', dark ? 'dark' : 'light');
}
applyTheme(dark);
themeBtn.addEventListener('click', () => applyTheme(!dark));

/* ══════════════════════════════════════════
   HELPERS
══════════════════════════════════════════ */
const WA_ICON = `<svg class="wa-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">

function coordsFrom(url) {
  if (!url) return null;
  let u = url;
  try { u = decodeURIComponent(url); } catch(e) {}
  const m = u.match(/[?&](?:q|query|ll|destination)=\s*(-?\d+\.?\d*)\s*,\s*(-?\d+\.?\d*)/) ||
            u.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) ||
            u.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
  return m ? m[1] + ',' + m[2] : null;
}
function routeUrl(googleUrl) {
  const c = coordsFrom(googleUrl);
  if (c) return 'https://www.google.com/maps/dir/?api=1&destination=' + c;
  return googleUrl || '';
}
function mapRowHTML(neshan, google) {
  const route = routeUrl(google);
  if (!neshan && !google) return '';
  let h = '<div class="map-row">';
  if (route) h += `<a href="${route}" target="_blank" rel="noopener" class="map-btn map-route">🧭 مسیریابی</a>`;
  if (neshan) h += `<a href="${neshan}" target="_blank" rel="noopener" class="map-btn map-n">🗺️ نشان</a>`;
  if (google) h += `<a href="${google}" target="_blank" rel="noopener" class="map-btn map-n">🌍 گوگل مپ</a>`;
  return h + '</div>';
}

function avatarHTML(c, emoji, cls = '') {

  }
  return `<div class="c-avatar ${cls}" aria-hidden="true">${emoji}</div>`;
}
function openPhoto(src, cap) {

function buildPhone(num, cc) {

/* داده هتل‌ها را به ازای هر شهر نگه می‌داریم */
const _hotelData = {};

const HOTEL_PREVIEW = 5;

function hotelThumb(h, cls = '', attrs = '') {
  const first = hotelImages(h)[0];
  return first
    ? `<img class="hotel-thumb ${cls}" src="${first}" alt="" loading="lazy" ${attrs} onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'🏨',style:'font-size:22px'}))">`
    : `<span style="font-size:22px" aria-hidden="true">🏨</span>`;
}

function hotelItemsHTML(cityId, list) {
  return list.map(h => `
      <div class="hotel-drop-item" onclick="hotelSelect('${cityId}','${h.id.replace(/'/g,"\\'")}')">
        ${hotelThumb(h)}
        <div>
          <div class="hotel-drop-name">${h.name}</div>
          ${h.nameEn ? `<div class="hotel-drop-sub">${h.nameEn}</div>` : ''}
        </div>
      </div>`).join('');
}

/* وقتی کادر جستجو خالی است: چند هتل اول را نشان بده */
function showDefaultHotels(cityId, all) {
  const drop = document.getElementById('hotel-drop-' + cityId);
  const hotels = _hotelData[cityId] || [];
  if (!drop || !hotels.length) return;
  const list = all ? hotels : hotels.slice(0, HOTEL_PREVIEW);
  let html = `<div class="hotel-list-cap">${all ? 'همه هتل‌ها' : 'هتل‌ها'}</div>` + hotelItemsHTML(cityId, list);
  if (!all && hotels.length > HOTEL_PREVIEW) {
    html += `<div class="hotel-more" onclick="showDefaultHotels('${cityId}', true)">
      نمایش همه هتل‌ها (${(hotels.length).toLocaleString('fa')}) ▾<br><small>یا نام هتل را در کادر بالا جستجو کنید</small></div>`;
  }
  drop.innerHTML = html;
  drop.classList.add('show');
}

function hotelSearch(input, cityId) {
  const q = input.value.trim();
  const clearBtn = input.parentElement.querySelector('.hotel-search-clear');
  clearBtn.classList.toggle('show', q.length > 0);

  const drop = document.getElementById('hotel-drop-' + cityId);
  const detail = document.getElementById('hotel-detail-' + cityId);
  detail.classList.remove('show');
  detail.innerHTML = '';

  if (!q) { showDefaultHotels(cityId); return; }

  const hotels = _hotelData[cityId] || [];
  const results = hotels.filter(h =>
    h.name.includes(q) || (h.nameEn || '').toLowerCase().includes(q.toLowerCase())
  );

  if (!results.length) {
    drop.innerHTML = `<div class="hotel-empty">هتلی با این نام پیدا نشد</div>`;
  } else {
    drop.innerHTML = hotelItemsHTML(cityId, results);
  }
  drop.classList.add('show');
}

function hotelSelect(cityId, hotelId) {
  const hotel = (_hotelData[cityId] || []).find(h => h.id === hotelId);
  if (!hotel) return;

  const drop = document.getElementById('hotel-drop-' + cityId);
  const detail = document.getElementById('hotel-detail-' + cityId);
  const input = document.querySelector(`#hotel-wrap-${cityId} .hotel-search-input`);

  drop.classList.remove('show');
  input.value = hotel.name;

  let html = `
    <div class="hotel-detail-head">
      <button class="hotel-detail-back" onclick="hotelClear('${cityId}')" aria-label="بازگشت">‹</button>
      ${hotelThumb(hotel, 'lg', `onclick="openGallery('${cityId}','${hotel.id.replace(/'/g,"\\'")}')"`)}
      <div class="hotel-detail-name">${hotel.name}</div>
      <span class="badge badge-hotel">هتل</span>
    </div>`;

  if (hotel.address) {
    html += `
    <div class="addr-row">
      <div class="addr-ico" aria-hidden="true">📍</div>
      <div class="addr-body">
        <div class="addr-lbl">آدرس</div>
        <div class="addr-txt">${hotel.address}</div>
      </div>
    </div>`;
  }

  const imgs = hotelImages(hotel);
  if (imgs.length) {
    html += `
    <button class="hotel-card-img-btn" onclick="openGallery('${cityId}','${hotel.id.replace(/'/g,"\\'")}')"
            aria-label="مشاهده تصاویر هتل">
      <span aria-hidden="true">🖼️</span>
      <span class="hc-txt">مشاهده تصاویر هتل${imgs.length > 1 ? ' (' + imgs.length.toLocaleString('fa') + ' تصویر)' : ''}</span>
      <span aria-hidden="true" style="font-size:11px;opacity:.6">›</span>
    </button>`;
  }

  html += mapRowHTML(hotel.mapNeshanUrl, hotel.mapGoogleUrl);

  if (hotel.contacts && hotel.contacts.length > 0) {
    html += `<div class="divider-lbl">شماره‌های تماس</div><div class="contacts" role="list">`;
    hotel.contacts.forEach(c => { html += contactHTML(c, '📞'); });
    html += `</div>`;
  }

  detail.innerHTML = html;
  detail.classList.add('show');
}

function hotelClear(cityId) {
  const input = document.querySelector(`#hotel-wrap-${cityId} .hotel-search-input`);
  const clearBtn = document.querySelector(`#hotel-wrap-${cityId} .hotel-search-clear`);
  const drop = document.getElementById('hotel-drop-' + cityId);
  const detail = document.getElementById('hotel-detail-' + cityId);
  if (input) input.value = '';
  if (clearBtn) clearBtn.classList.remove('show');
  detail.classList.remove('show'); detail.innerHTML = '';
  showDefaultHotels(cityId);
}

function hotelImages(h) {
  return (h.images && h.images.length) ? h.images : (h.cardImage ? [h.cardImage] : []);
}

let galIdx = 0, galCount = 0;
function openGallery(cityId, hotelId) {
  const hotel = (_hotelData[cityId] || []).find(h => h.id === hotelId);
  if (!hotel) return;
  const imgs = hotelImages(hotel);
  if (!imgs.length) return;
  galIdx = 0; galCount = imgs.length;
  document.getElementById('cardModalTitle').textContent = hotel.name;
  document.getElementById('cardImgWrap').innerHTML = `
    <div class="gal" id="gal" onscroll="galScroll()">
      ${imgs.map((src, i) => `<img src="${src}" alt="تصویر ${i + 1} از ${hotel.name}" loading="${i ? 'lazy' : 'eager'}" onerror="this.style.opacity=.25">`).join('')}
    </div>
    ${imgs.length > 1 ? `
    <button class="gal-nav gal-prev" onclick="galGo(-1)" aria-label="قبلی"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 5 16 12 9 19"/></svg></button>
    <button class="gal-nav gal-next" onclick="galGo(1)" aria-label="بعدی"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 5 8 12 15 19"/></svg></button>
    <div class="gal-dots" id="galDots">${imgs.map((_, i) => `<span class="${i ? '' : 'on'}"></span>`).join('')}</div>
    <div class="gal-count" id="galCount" dir="ltr">${(1).toLocaleString('fa')} / ${imgs.length.toLocaleString('fa')}</div>` : ''}`;
  document.getElementById('cardOverlay').classList.add('open');
  galNav();
}
/* فلش قبلی در تصویر اول و فلش بعدی در تصویر آخر پنهان می‌شود */
function galNav() {
  const prev = document.querySelector('.gal-prev'), next = document.querySelector('.gal-next');
  if (prev) prev.style.display = galIdx <= 0 ? 'none' : 'flex';
  if (next) next.style.display = galIdx >= galCount - 1 ? 'none' : 'flex';
}
function galScroll() {
  const g = document.getElementById('gal');
  if (!g || !g.clientWidth) return;
  const i = Math.min(galCount - 1, Math.round(Math.abs(g.scrollLeft) / g.clientWidth));
  if (i === galIdx) return;
  galIdx = i;
  galNav();
  document.querySelectorAll('#galDots span').forEach((d, k) => d.classList.toggle('on', k === i));
  const c = document.getElementById('galCount');
  if (c) c.textContent = (i + 1).toLocaleString('fa') + ' / ' + galCount.toLocaleString('fa');
}
function galGo(d) {
  const g = document.getElementById('gal');
  const i = Math.max(0, Math.min(galCount - 1, galIdx + d));
  if (g && g.children[i]) g.children[i].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}

}

        address: city.hq.address,
        mapNeshan: city.hq.mapNeshanUrl, mapGoogle: city.hq.mapGoogleUrl,
        contacts: city.hq.contacts
      });
    }

    // Clinic
    if (city.clinic) {
      cityHTML += sectionCard({
        id: `${city.id}-clinic`, kind: 'clinic', icoClass: 'ico-clinic', icoEmoji: RC_ICON,
        title: city.clinic.title, badge: 'درمانگاه', badgeClass: 'badge-acc',
        address: city.clinic.address,
        mapNeshan: city.clinic.mapNeshanUrl, mapGoogle: city.clinic.mapGoogleUrl,
        contacts: city.clinic.contacts
      });
    }

    // Hotels
    if (city.hotels && city.hotels.length > 0) {
      _hotelData[city.id] = city.hotels;
      cityHTML += hotelSearchSection(city.id, city.hotels);
      hotelCities.push(city.id);
    }

    // Consulate
    if (city.consulate) {
      cityHTML += sectionCard({
        id: `${city.id}-consulate`, kind: 'consulate', icoClass: 'ico-consulate', icoEmoji: '🏛️',
        title: city.consulate.title, badge: 'کنسولگری', badgeClass: 'badge-acc',
        address: city.consulate.address || null,
        mapNeshan: city.consulate.mapNeshanUrl, mapGoogle: city.consulate.mapGoogleUrl,
        contacts: city.consulate.contacts
      });
    }

    cityHTML += `</div>`;
    sectionsHTML += cityHTML;
  });

  tabList.innerHTML = tabsHTML;
  mainContent.innerHTML = sectionsHTML + footerHTML();
  hotelCities.forEach(id => showDefaultHotels(id));

  // برگرداندن شهر انتخاب‌شده قبلی (مثلاً بعد از بروزرسانی خودکار صفحه)
  try {
    const last = sessionStorage.getItem('caravan-city');
    if (last && document.getElementById('sec-' + last)) switchTab(last, true);
  } catch(e) {}
}

const DEFAULT_FOOTER = [
  { type: 'heading', text: '✦ بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيم ✦' },
  { type: 'bold',    text: 'هزینه استفاده از این برنامه' },
  { type: 'text',    text: 'صلواتی نثار روح پاک شهدا و درگذشتگان 🌹' },
  { type: 'divider', text: '' },
  { type: 'text',    text: 'طراحی و برنامه‌نویسی: **محمد میراحمدیان**\nاگر این برنامه برایتان مفید بود،' },
  { type: 'bold',    text: 'پدرم را هم در دعایتان یاد کنید 🤲' }
];

function escHtml(t) {
  return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
/* **متن** → پررنگ ، خط جدید → br */
function richText(t) {
  return escHtml(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
}

function footerHTML() {
  const blocks = (CARAVAN_DATA.site && CARAVAN_DATA.site.footer) || DEFAULT_FOOTER;
  const body = blocks.map(b => {
    if (b.type === 'divider') return '<div class="footer-divider"></div>';
    const cls = { heading: 'footer-bismillah', bold: 'footer-bold', text: 'footer-text' }[b.type] || 'footer-text';
    return `<div class="${cls}">${richText(b.text || '')}</div>`;
  }).join('');
  return `
  <footer class="footer" role="contentinfo">
    ${body}
    <div class="footer-update"><span aria-hidden="true">🕐</span> آخرین بروزرسانی: <strong>${escHtml(CARAVAN_DATA.lastUpdate || '—')}</strong></div>
    <a class="footer-admin" href="admin.html">⚙️ ورود مدیر</a>
  </footer>`;
}

/* ══════════════════════════════════════════
   QUICK JUMP
══════════════════════════════════════════ */
function jumpTo(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}

/* ══════════════════════════════════════════
   FONT SIZE + sticky offsets
══════════════════════════════════════════ */
const FS_LEVELS = [1, 1.15, 1.3];
let fsIdx = 0;
try { fsIdx = Math.min(FS_LEVELS.length - 1, Math.max(0, +localStorage.getItem('caravan-fs') || 0)); } catch(e) {}

function updateSticky() {
  const header = document.querySelector('.header');
  const tabs = document.querySelector('.tabs-wrap');
  if (!header || !tabs) return;
  tabs.style.top = header.offsetHeight + 'px';
  document.documentElement.style.setProperty('--stick', (header.offsetHeight + tabs.offsetHeight + 12) + 'px');
}
function applyFs() {
  document.documentElement.style.setProperty('--fs', FS_LEVELS[fsIdx]);
  document.getElementById('fsBtn').textContent = ['A', 'A+', 'A++'][fsIdx];
  try { localStorage.setItem('caravan-fs', fsIdx); } catch(e) {}
  updateSticky();
}
document.getElementById('fsBtn').addEventListener('click', () => {
  fsIdx = (fsIdx + 1) % FS_LEVELS.length;
  applyFs();
  showToast('اندازه نوشته: ' + ['معمولی', 'بزرگ', 'خیلی بزرگ'][fsIdx]);
});
window.addEventListener('resize', updateSticky);
window.addEventListener('load', updateSticky);

/* ══════════════════════════════════════════
   TABS
══════════════════════════════════════════ */
function switchTab(cityId, silent) {
  document.querySelectorAll('.city-sec').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.remove('active');
    t.setAttribute('aria-selected','false');
  });
  const sec = document.getElementById('sec-' + cityId);
  const tab = document.getElementById('tab-' + cityId);
  if (sec) sec.classList.add('active');
  if (tab) { tab.classList.add('active'); tab.setAttribute('aria-selected','true'); }
  try { sessionStorage.setItem('caravan-city', cityId); } catch(e) {}
  if (!silent) window.scrollTo({ top: 0, behavior: 'smooth' });
}

function handleTabKey(e, cityId) {
  const tabs = Array.from(document.querySelectorAll('.tab'));
  const idx = tabs.findIndex(t => t.id === 'tab-' + cityId);
  if (e.key === 'ArrowRight' && idx > 0) { tabs[idx-1].click(); tabs[idx-1].focus(); }
  if (e.key === 'ArrowLeft' && idx < tabs.length-1) { tabs[idx+1].click(); tabs[idx+1].focus(); }
}

/* ══════════════════════════════════════════
   EMERGENCY accordion
══════════════════════════════════════════ */
function toggleEmergency() {
  const el = document.getElementById('emergency');
  const btn = document.getElementById('emergencyBtn');
  const body = document.getElementById('eBody');
  const open = el.classList.toggle('open');
  btn.setAttribute('aria-expanded', open);
  body.setAttribute('aria-hidden', !open);
}

/* ══════════════════════════════════════════
   COPY
══════════════════════════════════════════ */
function copyNum(num, btn) {
  navigator.clipboard.writeText(num).then(() => {
    btn.innerHTML = '<svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
    btn.classList.add('done');
    showToast('شماره کپی شد ✅');
    setTimeout(() => {
      btn.innerHTML = COPY_ICON;
      btn.classList.remove('done');
    }, 2200);
  }).catch(() => showToast('خطا در کپی'));
}

/* ══════════════════════════════════════════
   TOAST
══════════════════════════════════════════ */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ══════════════════════════════════════════
   SEARCH
══════════════════════════════════════════ */
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');
const searchResults = document.getElementById('searchResults');
const srBody = document.getElementById('srBody');

function getAllContacts() {
  const list = [];
  CARAVAN_DATA.cities.forEach(city => {
    ['hq','clinic','consulate'].forEach(sec => {
      if (!city[sec]) return;
      (city[sec].contacts || []).forEach(c => {
        list.push({ ...c, cityName: city.name, sectionTitle: city[sec].title });
      });
    });
    (city.hotels || []).forEach(hotel => {
      (hotel.contacts || []).forEach(c => {
        list.push({ ...c, cityName: city.name, sectionTitle: hotel.name });
      });
    });
  });
  (CARAVAN_DATA.insurance?.contacts || []).forEach(c => {
    list.push({ ...c, cityName: 'بیمه مشترک', sectionTitle: CARAVAN_DATA.insurance.title });
  });
  (CARAVAN_DATA.transport?.contacts || []).forEach(c => {
    list.push({ ...c, cityName: 'نقل مشترک', sectionTitle: CARAVAN_DATA.transport.title });
  });
  return list;
}

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim();
  searchClear.classList.toggle('show', q.length > 0);
  if (!q) { searchResults.classList.remove('show'); return; }

  const results = getAllContacts().filter(c =>
    c.phone.includes(q) || c.role.includes(q) || (c.name && c.name.includes(q)) ||
    c.cityName.includes(q) || c.sectionTitle.includes(q)
  );

  if (!results.length) {
    srBody.innerHTML = `<div class="sr-empty">نتیجه‌ای پیدا نشد</div>`;
  } else {
    srBody.innerHTML = results.map(c => {
      const intl = buildPhone(c.phone, c.countryCode);
      return `
      <div class="c-item">
        ${avatarHTML(c, '👤')}
        <div class="c-info">
          <div class="c-role">${c.cityName} · ${c.role}</div>
          <div class="c-phone" dir="ltr">${c.phone}</div>
          ${c.name ? `<div class="c-name">${c.name}</div>` : ''}
        </div>
        <div class="c-acts">
          <a href="tel:${intl}" class="act act-call" aria-label="تماس">${PHONE_ICON}</a>
          <a href="https://wa.me/${intl.replace('+','')}" target="_blank" rel="noopener"
             class="act act-wa" aria-label="واتساپ">${WA_ICON}</a>
          <button class="act act-cp" onclick="copyNum('${c.phone}',this)"
                  aria-label="کپی شماره">${COPY_ICON}</button>
        </div>
      </div>`;
    }).join('');
  }
  searchResults.classList.add('show');
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchClear.classList.remove('show');
  searchResults.classList.remove('show');
  searchInput.focus();
});

/* ══════════════════════════════════════════
   QR CODE (lazy loaded)
══════════════════════════════════════════ */
let qrDone = false;
function showQR() {
  const url = window.location.href.split('?')[0].split('#')[0];
  document.getElementById('qrUrl').textContent = url;
  document.getElementById('qrOverlay').classList.add('open');

  if (!qrDone) {
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    script.onload = () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      new QRCode(document.getElementById('qrcode'), {
        text: url, width: 200, height: 200,
        colorDark: isDark ? '#FFFFFF' : '#0A1F14',
        colorLight: isDark ? '#133523' : '#FFFFFF',
        correctLevel: QRCode.CorrectLevel.H
      });
      qrDone = true;
    };
    document.head.appendChild(script);
  }
}

function closeQR() {
  document.getElementById('qrOverlay').classList.remove('open');
}
document.getElementById('qrOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeQR();
});

/* ══════════════════════════════════════════
   SHARE
══════════════════════════════════════════ */
function shareApp() {
  const url = window.location.href.split('?')[0].split('#')[0];
  if (navigator.share) {
    navigator.share({
      title: 'راهنمای کاروان عراق',
      text: 'اطلاعات تماس ستادها و درمانگاه‌های ایرانی در عراق',
      url
    }).catch(() => {});
  } else {
    navigator.clipboard.writeText(url).then(() => showToast('لینک کپی شد 🔗'));
  }
}

/* ══════════════════════════════════════════
   PWA INSTALL
══════════════════════════════════════════ */
let deferredPrompt;
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  if (isStandalone) return;
  deferredPrompt = e;
  document.getElementById('installBanner').classList.add('show');
});

document.getElementById('installBtn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('installBanner').classList.remove('show');
  if (outcome === 'accepted') showToast('برنامه نصب شد ✅');
});

window.addEventListener('appinstalled', () => {
  document.getElementById('installBanner').classList.remove('show');
  showToast('نصب با موفقیت انجام شد ✅');
});

/* ══════════════════════════════════════════
   SWIPE to change city
══════════════════════════════════════════ */
let touchStartX = 0, touchStartY = 0, touchIgnore = false;
document.addEventListener('touchstart', e => {
  touchStartX = e.changedTouches[0].clientX;
  touchStartY = e.changedTouches[0].clientY;
  touchIgnore = !!e.target.closest('input, textarea, select, .hotel-dropdown, .modal, .card-modal, .search-results, #foodView');
}, { passive: true });
document.addEventListener('touchend', e => {
  if (touchIgnore) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) < 110 || Math.abs(dx) < Math.abs(dy) * 2.5) return;
  const tabs = Array.from(document.querySelectorAll('.tab'));
  const activeIdx = tabs.findIndex(t => t.classList.contains('active'));
  if (dx < 0 && activeIdx < tabs.length - 1) tabs[activeIdx + 1].click(); // swipe left → next
  if (dx > 0 && activeIdx > 0) tabs[activeIdx - 1].click();               // swipe right → prev
}, { passive: true });

/* ══════════════════════════════════════════
   SERVICE WORKER — auto-update
══════════════════════════════════════════ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('./sw.js');

      /* وقتی SW جدیدی نصب شد، فعالش کن */
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            newWorker.postMessage('SKIP_WAITING');
          }
        });
      });

      /* وقتی SW عوض شد، صفحه را reload کن */
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) { refreshing = true; window.location.reload(); }
      });

      /* بررسی دستی آپدیت در هر بار باز شدن */
      reg.update().catch(() => {});
    } catch(e) {}
  });
}

render();
applyFs();
foodRestore();
</script>
