name = "hamyar-reviews"
main = "reviews.js"
compatibility_date = "2026-10-01"
workers_dev = true

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "hamyar-reviews"
database_id = "83e811da-280d-4122-918a-62e42a0b1098"

# پشتیبان‌های سرور 188 (guard.js)
[[d1_databases]]
binding = "BKDB"
database_name = "hamyar-backups"
database_id = "74d9e2c7-e22d-4389-8d44-a214943c6b70"

# نگهبان سرور هر ۵ دقیقه
[triggers]
crons = ["*/5 * * * *"]

# داده‌های سامانه نواقص هتل‌ها (worker/team-api) — فقط برای پشتیبان روزانه در guard.js خوانده می‌شود
[[d1_databases]]
binding = "HDB"
database_name = "hamyar-hotels"
database_id = "10359407-12af-4227-8991-fe9ef7ff9046"

# تکه‌های عکس و فیلم سامانه نواقص — فقط برای نشان دادن حجم در پنل (کارت ☁️ Cloudflare)
[[d1_databases]]
binding = "MDB"
database_name = "hamyar-hotels-media"
database_id = "a8fccebf-9f09-47bc-92f2-ea34a9959b3d"
